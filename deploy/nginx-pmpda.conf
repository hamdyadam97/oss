# Nginx site for pmpda.com (installed by deploy/install.sh, which fills in __APP__ and the domain).
# After installing:  sudo certbot --nginx -d pmpda.com -d www.pmpda.com   (adds HTTPS + http->https)

upstream pmpda_api {
    server unix:/run/pmpda/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name pmpda.com www.pmpda.com;

    # One canonical address: www -> pmpda.com
    if ($host = www.pmpda.com) {
        return 301 https://pmpda.com$request_uri;
    }

    root __APP__/frontend/dist;
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://www.google.com https://maps.google.com https://www.youtube-nocookie.com https://www.youtube.com; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # API, Django admin, sitemap and robots go to Gunicorn
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://pmpda_api;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors cannot forge their IP in the audit log or throttles
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://pmpda_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias __APP__/backend/staticfiles/;
        expires 30d;
    }

    # Public uploads only. backend/private_media (beneficiary attachments) is deliberately not exposed.
    location /media/ {
        alias __APP__/backend/media/;
        expires 7d;
        location ~* \.(html?|svg|js|xml)$ { deny all; }
    }

    # Hashed build files never change
    location /assets/ {
        expires 1y;
    }

    # React app: every other path falls back to index.html
    location / {
        try_files $uri /index.html;
    }
}
